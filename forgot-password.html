
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Reset Password | BHADEX PLUGS</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }

    body {
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .reset-container {
      width: min(440px, 92%);
      margin: 65px auto;
    }

    .reset-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 28px;
    }

    .reset-card h1 {
      margin-top: 0;
      font-size: 27px;
    }

    .muted {
      color: #aaa;
      line-height: 1.6;
    }

    .reset-card label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    .reset-card input {
      width: 100%;
      padding: 13px;
      background: #080808;
      color: white;
      border: 1px solid #444;
      border-radius: 7px;
      outline: none;
    }

    .reset-card input:focus {
      border-color: #e0b04b;
    }

    .reset-card button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #e0b04b;
      color: #080808;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-card button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      line-height: 1.5;
      font-size: 14px;
    }

    .success { color: #4ade80; }
    .error { color: #ff7777; }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #e0b04b;
      text-decoration: none;
    }

    #resetSection { display: none; }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">BHADEX PLUGS</a>
</header>

<main class="reset-container">
  <section class="reset-card">
    <h1>Forgot Password?</h1>
    <p class="muted">
      Enter your account email address. We'll send you a verification
      code so you can create a new password.
    </p>

    <form id="requestForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        autocomplete="email"
        required
      >
      <button type="submit" id="sendButton">Send Verification Code</button>
    </form>

    <div id="resetSection">
      <p class="muted">
        If your account is eligible, a 6-digit verification code
        will arrive by email. Enter it below.
      </p>

      <form id="resetForm">
        <label for="code">Verification Code</label>
        <input
          type="text"
          id="code"
          placeholder="Enter 6-digit code"
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          autocomplete="one-time-code"
          required
        >

        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          placeholder="At least 10 characters"
          minlength="10"
          maxlength="128"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Enter your new password again"
          minlength="10"
          maxlength="128"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="resetButton">Reset Password</button>
      </form>
    </div>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back-link" href="login.html">Back to Login</a>
  </section>
</main>

<script>
const requestForm = document.getElementById("requestForm");
const resetForm = document.getElementById("resetForm");
const resetSection = document.getElementById("resetSection");
const emailInput = document.getElementById("email");
const codeInput = document.getElementById("code");
const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");
const sendButton = document.getElementById("sendButton");
const resetButton = document.getElementById("resetButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

async function readResponse(response) {
  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(result.error || "Something went wrong. Please try again.");
  }

  return result;
}

requestForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim().toLowerCase();

  sendButton.disabled = true;
  sendButton.textContent = "Sending...";
  showMessage("", "");

  try {
    const response = await fetch("/api/customer/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    const result = await readResponse(response);

    showMessage(
      result.message || "If an eligible account exists, a verification code will be sent.",
      "success"
    );

    resetSection.style.display = "block";
    codeInput.focus();
  } catch (error) {
    showMessage(error.message, "error");
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = "Send Verification Code";
  }
});

resetForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim().toLowerCase();
  const code = codeInput.value.trim();
  const newPassword = newPasswordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (!/^[0-9]{6}$/.test(code)) {
    showMessage("Enter the 6-digit verification code.", "error");
    return;
  }

  if (newPassword.length < 10) {
    showMessage("Your new password must contain at least 10 characters.", "error");
    return;
  }

  if (newPassword !== confirmPassword) {
    showMessage("Your passwords do not match.", "error");
    return;
  }

  resetButton.disabled = true;
  resetButton.textContent = "Resetting...";
  showMessage("", "");

  try {
    const response = await fetch("/api/customer/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, code, newPassword })
    });

    const result = await readResponse(response);

    showMessage(
      result.message || "Your password has been reset successfully. You can now log in.",
      "success"
    );

    resetForm.reset();

    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);

  } catch (error) {
    showMessage(error.message, "error");
  } finally {
    resetButton.disabled = false;
    resetButton.textContent = "Reset Password";
  }
});
</script>

</body>
</html>
