
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHADEX PLUGS | Admin Dashboard</title>
  <style>
    :root {
      --red: #ff263d;
      --dark: #080808;
      --panel: #141414;
      --white: #fff;
      --muted: #999;
      --border: rgba(255,255,255,.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--white);
      font-family: Arial, sans-serif;
      padding: 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .brand { font-size: 22px; font-weight: 800; }
    .brand span { color: var(--red); }

    button {
      border: 0;
      border-radius: 7px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary { background: var(--red); color: white; }
    .secondary { background: #292929; color: white; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat, .orders-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat p { color: var(--muted); margin-bottom: 12px; }
    .stat h2 { font-size: 28px; }

    .orders-panel h2 { margin-bottom: 18px; }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input {
      background: #222;
      border: 1px solid var(--border);
      color: white;
      border-radius: 7px;
      padding: 12px;
      min-width: 220px;
      flex: 1;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th, td {
      text-align: left;
      padding: 14px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    th { color: var(--muted); }

    .status {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 5px;
      background: #193d2b;
      color: #75e6a4;
    }

    #message {
      color: var(--muted);
      margin-top: 15px;
    }

    #loginScreen {
      max-width: 400px;
      margin: 100px auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
    }

    #loginScreen h2 { margin-bottom: 20px; }
    #loginScreen input { width: 100%; margin-bottom: 12px; }
    #loginScreen button { width: 100%; }

    #dashboard { display: none; }

    @media(max-width: 600px) {
      body { padding: 15px; }
    }
  </style>
</head>

<body>

  <div id="loginScreen">
    <h2>BHADEX <span style="color:#ff263d">ADMIN</span></h2>
    <p style="color:#999;margin-bottom:20px">
      Sign in to your administrator account.
    </p>

    <input
      type="password"
      id="password"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <button class="primary" onclick="login()">Login</button>
    <p id="loginMessage" style="margin-top:15px;color:#ff5365"></p>
  </div>

  <main id="dashboard">

    <header>
      <div class="brand">BHADEX <span>PLUGS</span></div>
      <button class="secondary" onclick="logout()">Logout</button>
    </header>

    <h1 style="margin-bottom:8px">Admin Dashboard</h1>
    <p style="color:#999;margin-bottom:25px">
      Manage your marketplace orders.
    </p>

    <section class="stats">
      <div class="stat">
        <p>Total Orders</p>
        <h2 id="totalOrders">—</h2>
      </div>

      <div class="stat">
        <p>Paid Orders</p>
        <h2 id="paidOrders">—</h2>
      </div>

      <div class="stat">
        <p>Total Revenue</p>
        <h2 id="totalRevenue">—</h2>
      </div>
    </section>

    <section class="orders-panel">
      <h2>Customer Orders</h2>

      <div class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="Search by email or reference"
          oninput="filterOrders()"
        >

        <button class="primary" onclick="loadOrders()">
          Refresh
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Reference</th>
              <th>Email</th>
              <th>Product</th>
              <th>Package</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>

      <p id="message">Sign in to load orders.</p>
    </section>

  </main>

  <script>
    let orders = [];

    async function login() {
      const password = document.getElementById("password").value;
      const message = document.getElementById("loginMessage");

      message.textContent = "Checking login...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Login failed.");
        }

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";

        await loadOrders();

      } catch (error) {
        message.textContent = error.message;
      }
    }

    async function logout() {
      await fetch("/api/admin/logout", { method: "POST" });
      location.reload();
    }

    async function loadOrders() {
      const message = document.getElementById("message");
      message.textContent = "Loading orders...";

      try {
        const response = await fetch("/api/admin/orders");
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Could not load orders.");
        }

        orders = data.orders || [];

        document.getElementById("totalOrders").textContent =
          data.stats.totalOrders;

        document.getElementById("paidOrders").textContent =
          data.stats.paidOrders;

        document.getElementById("totalRevenue").textContent =
          "GHS " + Number(data.stats.totalRevenue).toFixed(2);

        renderOrders(orders);
        message.textContent = orders.length + " order(s) found.";

      } catch (error) {
        message.textContent = error.message;
      }
    }

    function renderOrders(items) {
      const body = document.getElementById("ordersBody");
      body.replaceChildren();

      if (!items.length) {
        body.innerHTML =
          '<tr><td colspan="7">No orders found.</td></tr>';
        return;
      }

      items.forEach(order => {
        const row = document.createElement("tr");

        const values = [
          order.reference,
          order.customer_email || "—",
          order.product,
          order.package,
          "GHS " + Number(order.amount).toFixed(2),
          order.status,
          new Date(order.created_at).toLocaleString()
        ];

        values.forEach((value, index) => {
          const cell = document.createElement("td");

          if (index === 5) {
            const badge = document.createElement("span");
            badge.className = "status";
            badge.textContent = value;
            cell.appendChild(badge);
          } else {
            cell.textContent = value;
          }

          row.appendChild(cell);
        });

        body.appendChild(row);
      });
    }

    function filterOrders() {
      const term = document.getElementById("search").value.toLowerCase();

      const filtered = orders.filter(order =>
        String(order.reference).toLowerCase().includes(term) ||
        String(order.customer_email || "").toLowerCase().includes(term)
      );

      renderOrders(filtered);
    }
  </script>

</body>
</html>
