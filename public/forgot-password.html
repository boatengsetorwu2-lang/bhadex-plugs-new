
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Reset Password | BHADEX PLUGS</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .reset-container {
      width: min(440px, 92%);
      margin: 55px auto;
    }
    .reset-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 25px;
    }
    .reset-card h1 { margin-top: 0; }
    .reset-card label {
      display: block;
      margin: 15px 0 7px;
    }
    .reset-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #444;
      background: #080808;
      color: white;
    }
    .reset-card button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #d71920;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .muted { color: #aaa; }
    #message { margin-top: 16px; }
    a { color: #ff7777; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">BHADEX PLUGS</a>
  </header>

  <main class="reset-container">
    <section class="reset-card">
      <h1>Forgot Password?</h1>
      <p class="muted">
        Enter your account email. We will send you a verification code
        to reset your password.
      </p>

      <form id="requestForm">
        <label for="requestEmail">Email address</label>
        <input id="requestEmail" type="email" required>
        <button type="submit" id="sendButton">Send Verification Code</button>
      </form>

      <form id="resetForm" class="hidden">
        <label for="resetEmail">Email address</label>
        <input id="resetEmail" type="email" required>

        <label for="code">6-digit verification code</label>
        <input id="code" type="text" inputmode="numeric"
          pattern="[0-9]{6}" maxlength="6" required>

        <label for="newPassword">New password</label>
        <input id="newPassword" type="password"
          minlength="10" maxlength="128" required>

        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password"
          minlength="10" maxlength="128" required>

        <button type="submit" id="resetButton">Reset Password</button>
      </form>

      <p id="message" role="status"></p>
      <p class="muted"><a href="login.html">Back to Login</a></p>
    </section>
  </main>

  <script>
    const requestForm = document.getElementById("requestForm");
    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("message");

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("requestEmail").value.trim();
      const button = document.getElementById("sendButton");

      button.disabled = true;
      button.textContent = "Sending...";
      message.textContent = "";

      try {
        const response = await fetch("/api/customer/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ email })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Could not send verification code.");
        }

        document.getElementById("resetEmail").value = email;
        requestForm.classList.add("hidden");
        resetForm.classList.remove("hidden");
        message.textContent = result.message ||
          "If an eligible account exists, a verification code has been sent. Check your email.";
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Send Verification Code";
      }
    });

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("resetEmail").value.trim();
      const code = document.getElementById("code").value.trim();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const button = document.getElementById("resetButton");

      if (newPassword !== confirmPassword) {
        message.textContent = "Your passwords do not match.";
        return;
      }

      if (newPassword.length < 10) {
        message.textContent = "Your password must contain at least 10 characters.";
        return;
      }

      button.disabled = true;
      button.textContent = "Resetting...";
      message.textContent = "";

      try {
        const response = await fetch("/api/customer/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ email, code, newPassword })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Password reset failed.");
        }

        message.textContent = "Password reset successfully. You can now log in.";
        resetForm.classList.add("hidden");
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Reset Password";
      }
    });
  </script>
</body>
</html>
