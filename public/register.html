
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Create Account | BHADEX PLUGS</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .auth-container {
      width: min(430px, 92%);
      margin: 65px auto;
      padding: 30px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      box-sizing: border-box;
    }

    .auth-container h1 { margin-bottom: 8px; }

    .auth-container p {
      color: #aaa;
      margin-bottom: 24px;
    }

    .auth-container label {
      display: block;
      margin: 16px 0 7px;
    }

    .auth-container input {
      width: 100%;
      padding: 13px;
      color: white;
      background: #080808;
      border: 1px solid #333;
      border-radius: 7px;
      box-sizing: border-box;
    }

    .auth-container button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      color: white;
      background: #d71920;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .auth-container button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .auth-footer {
      margin-top: 20px;
      text-align: center;
    }

    .auth-footer a,
    #resendButton {
      color: #e53935;
    }

    #resendButton {
      background: transparent;
      border: 1px solid #444;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .otp-input {
      text-align: center;
      letter-spacing: 10px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">BHADEX PLUGS</a>
</header>

<main class="auth-container">

  <section id="registerSection">
    <h1>Create Account</h1>
    <p>Join BHADEX PLUGS to manage and track your orders.</p>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        id="name"
        type="text"
        placeholder="Enter your full name"
        required
        maxlength="100"
        autocomplete="name"
      >

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
        maxlength="255"
        autocomplete="email"
      >

      <label for="referralCode">Referral Code (optional)</label>
      <input
        id="referralCode"
        type="text"
        maxlength="30"
        placeholder="Enter a friend's referral code"
        autocomplete="off"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Create a password (10 characters minimum)"
        required
        minlength="10"
        maxlength="128"
        autocomplete="new-password"
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        placeholder="Enter your password again"
        required
        minlength="10"
        maxlength="128"
        autocomplete="new-password"
      >

      <button type="submit" id="registerButton">
        Create Account
      </button>

    </form>
  </section>

  <section id="verificationSection" class="hidden">

    <h1>Verify Your Email</h1>

    <p>
      We've sent a 6-digit verification code to
      <strong id="verificationEmail"></strong>.
      Enter the code below to activate your account.
    </p>

    <form id="verificationForm">

      <label for="otp">6-Digit Verification Code</label>

      <input
        id="otp"
        class="otp-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="000000"
        required
        autocomplete="one-time-code"
      >

      <button type="submit" id="verifyButton">
        Verify Email
      </button>

    </form>

    <button type="button" id="resendButton">
      Resend Verification Code
    </button>

  </section>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="auth-footer">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</main>

<script>
const registerSection = document.getElementById("registerSection");
const verificationSection = document.getElementById("verificationSection");

const registerForm = document.getElementById("registerForm");
const verificationForm = document.getElementById("verificationForm");

const message = document.getElementById("message");
const referralFromLink = new URLSearchParams(window.location.search).get("ref");
if (referralFromLink) {
  document.getElementById("referralCode").value = referralFromLink.trim().toUpperCase();
}

const registerButton = document.getElementById("registerButton");
const verifyButton = document.getElementById("verifyButton");
const resendButton = document.getElementById("resendButton");

let registeredEmail = "";

function showMessage(text, color = "#ff5555") {
  message.style.color = color;
  message.textContent = text;
}

function showVerification(email) {
  registeredEmail = email;

  registerSection.classList.add("hidden");
  verificationSection.classList.remove("hidden");

  document.getElementById("verificationEmail").textContent = email;

  message.textContent = "";
  document.getElementById("otp").focus();
}

// REGISTER
registerForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    showMessage("Your passwords do not match.");
    return;
  }

  if (password.length < 10) {
    showMessage("Your password must contain at least 10 characters.");
    return;
  }

  registerButton.disabled = true;
  registerButton.textContent = "Sending verification code...";
  message.textContent = "";

  try {
    const response = await fetch("/api/customer/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "same-origin",
      body: JSON.stringify({
        name,
        email,
        password,
        referralCode: document.getElementById("referralCode").value.trim()
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Registration failed.");
    }

    showVerification(email);
    showMessage(
      "Verification code sent! Check your email inbox.",
      "#4ade80"
    );

  } catch (error) {
    showMessage(error.message);
  } finally {
    registerButton.disabled = false;
    registerButton.textContent = "Create Account";
  }
});

// VERIFY EMAIL
verificationForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const code = document.getElementById("otp").value.trim();

  if (!/^\d{6}$/.test(code)) {
    showMessage("Enter the complete 6-digit verification code.");
    return;
  }

  verifyButton.disabled = true;
  verifyButton.textContent = "Verifying...";
  message.textContent = "";

  try {
    const response = await fetch("/api/customer/verify-email", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "same-origin",
      body: JSON.stringify({
        email: registeredEmail,
        code
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Email verification failed.");
    }

    showMessage(
      "Email verified successfully! Redirecting to your account...",
      "#4ade80"
    );

    window.location.href = "account.html";

  } catch (error) {
    showMessage(error.message);
  } finally {
    verifyButton.disabled = false;
    verifyButton.textContent = "Verify Email";
  }
});

// RESEND CODE
resendButton.addEventListener("click", async () => {
  resendButton.disabled = true;
  resendButton.textContent = "Sending new code...";

  try {
    const response = await fetch("/api/customer/resend-otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "same-origin",
      body: JSON.stringify({
        email: registeredEmail
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Unable to resend code.");
    }

    showMessage(result.message, "#4ade80");

  } catch (error) {
    showMessage(error.message);
  } finally {
    resendButton.disabled = false;
    resendButton.textContent = "Resend Verification Code";
  }
});
</script>

</body>
</html>
